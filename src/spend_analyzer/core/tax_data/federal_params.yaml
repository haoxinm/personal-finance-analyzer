# Federal income tax parameters per tax year, used by core/tax_calc.py (the per-user estimate and
# the 1040 line-16 ordinary/preferential split).
#
# Sources: the IRS inflation-adjustment revenue procedures named under each year's `sources`
# (section 3 of Rev. Proc. 2021-45 / 2022-38 / 2023-34 / 2024-40, section 4 of Rev. Proc. 2025-32),
# the Social Security Administration contribution and benefit base, and the IRS announcements of the
# 401(k) elective deferral limit (IR-2021-216, IR-2022-188, IR-2023-203, Notice 2024-80, Notice 2025-67). Treasury Fiscal
# Data does not publish brackets or deductions, so none of this can be fetched; the app makes no
# network call. Figures were read from the revenue procedures' own text. Verify against the IRS
# publication when adding a year, and add a year only from its revenue procedure.
#
# Layout: params_version (integer, raised whenever any figure in the file changes: a refreshed
# or imported file is only accepted over this one when its version is higher) and `years`:
#   year -> {sources, standard_deduction, additional_standard_deduction, capital_loss_limit,
#   ss_wage_base, elective_deferral_limit, niit_threshold, additional_medicare_threshold, brackets,
#   ltcg}. All money is whole dollars (the loader converts to cents).
#   standard_deduction            by filing status; qss uses the joint amount
#   additional_standard_deduction per aged / blind box: `unmarried` (single, hoh) and `married`
#                                 (mfj, mfs, qss)
#   capital_loss_limit            annual limit on a net capital loss against other income
#                                 (IRC 1211(b), not indexed): 3,000, married filing separately 1,500
#   ss_wage_base                  Social Security wage base (OASDI taxable maximum)
#   elective_deferral_limit       401(k)/403(b)/TSP employee elective deferral limit (no catch-up)
#   niit_threshold / additional_medicare_threshold  statutory MAGI / wage thresholds (IRC 1411,
#                                 3101(b)(2); not indexed). The estimate only warns about them.
#   brackets  [[lower threshold in dollars of taxable income, rate in percent], ...]; strictly
#             increasing thresholds and rates, first threshold 0, top rate applies above the last
#   ltcg      [top of the 0% band, top of the 15% band] in dollars of taxable income (the 20% rate
#             applies above); the thresholds are from section 1(j)(5)(B) / section 3.03 (4.03 for 2026)
# Filing statuses: single, mfj, mfs, hoh; qss (qualifying surviving spouse) uses the mfj tables.

