name: Docker

# Builds the container image for linux/amd64 and linux/arm64 (many NAS are ARM), smoke-tests the
# amd64 image (login, migrations, bind mounts, ownership, restart), then publishes it.
#
#   merge (push) to main       publish :latest  (the one tag users pull)  + :sha-<short commit>
#   run manually on main       same as a merge to main (Actions > Docker > Run workflow)
#   run manually elsewhere     build and smoke test only, nothing is pushed
#   tag vX.Y.Z                 publish :X.Y.Z, :X.Y and :X (not for 0.x) for people who pin
#   pull request               build and smoke test only, nothing is pushed
#
# Publishing happens only after the smoke test passes, so :latest never points at an image that
# failed it. Docker Hub gets the same tags when the repository secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN are set; without them that login and that destination are skipped. See
# docs/DOCKER.md ("Building and publishing").
#
# One-time, by hand: GitHub creates a new container package as private. After the first push open
# the package (repo page > Packages > personal-finance-analyzer > Package settings) and set its
# visibility to Public, or nobody can pull it without logging in.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "hatch_build.py"
      - "src/**"
      - "frontend/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

# One run per ref at a time; runs on main queue instead of cancelling, so :latest always ends up on
# the newest merge.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/haoxinm/personal-finance-analyzer
  DOCKERHUB_IMAGE_NAME: personal-finance-analyzer
  # Push only from main (merge or manual run) and from version tags.
  PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Optional Docker Hub publishing: set the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
      # (an access token, not your password). Unset secrets expand to empty strings.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    # This job can push packages, so every third-party action is pinned to a full commit SHA (a
    # moved tag cannot swap code in); the comment names the release. Dependabot bumps both.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU (to build the arm64 image on an amd64 runner)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the amd64 image and smoke-test it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: personal-finance-analyzer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (login, migrations, bind mounts, ownership, restart)
        run: PFA_SMOKE_CHECK_OWNER=1 docker/smoke-test.sh personal-finance-analyzer:ci

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (only when configured)
        if: env.PUBLISH == 'true' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Image names, tags and OCI labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ (env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '') && format('docker.io/{0}/{1}', env.DOCKERHUB_USERNAME, env.DOCKERHUB_IMAGE_NAME) || '' }}
          flavor: |
            latest=false
          # :latest tracks main, so it is what the compose file and the docs pull. Version tags
          # add fixed tags for pinning but never move :latest backwards.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=pr
          # org.opencontainers.image.source (and revision, version, created, ...) are added
          # automatically from the repository; it is what links the GHCR package to this repo.
          labels: |
            org.opencontainers.image.title=Personal Finance Analyzer
            org.opencontainers.image.description=Local-first spending, income and tax, and net-worth analysis from your own statements and tax forms. Self-hosted; no telemetry.
            org.opencontainers.image.licenses=MIT

      - name: Build for amd64 and arm64 (pushed only from main and version tags)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### Published"
            echo "Users pull: \`docker pull ${{ env.GHCR_IMAGE }}:latest\` (main only)"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "New package? Set its visibility to **Public** once: Packages > personal-finance-analyzer > Package settings."
          } >> "$GITHUB_STEP_SUMMARY"
