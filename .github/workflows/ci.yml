name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      # Windows' default text encoding is the legacy code page; make Python use UTF-8 everywhere.
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy --strict src

      - name: Test
        run: uv run pytest -q

  # The secret-storage tests that need a real Linux Secret Service. A throwaway D-Bus session and
  # an unlocked gnome-keyring stand in for the desktop login a Linux user has; every other test
  # (including `pytest -q` above) runs on an in-memory keyring and skips these.
  linux-keyring:
    # Pinned: the apt packages below (dbus-x11, gnome-keyring) are only known-good on 24.04, not 26.04.
    runs-on: ubuntu-24.04
    env:
      PFA_TEST_LINUX_KEYRING: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install D-Bus and gnome-keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libsecret-1-0

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Secret Service tests (dbus-run-session + gnome-keyring)
        run: |
          dbus-run-session -- bash -c '
            set -euo pipefail
            echo "ci-password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            uv run pytest -q -rs -m linux_keyring tests/core/test_secret_store_linux.py
          '

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npx tsc -b --noEmit

      - name: Lint (eslint)
        run: npx eslint .

      - name: Test (vitest)
        run: npx vitest run

      - name: Build
        run: npm run build

  e2e:
    # Pinned: Playwright 1.56 cannot install Chromium on ubuntu-latest (Ubuntu 26.04).
    # Move back to ubuntu-latest once the Playwright version supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright's Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e (D9 happy path)
        working-directory: frontend
        run: npx playwright test
